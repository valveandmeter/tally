<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>Tally</title>
<style>
  :root {
    --accent: #955f3a;
    --color-backdrop: #f2f2f2;
    --color-panel: #ffffff;
    --color-text: #262626;
    --color-text-secondary: #737373;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --color-backdrop: #1a1a1a;
      --color-panel: #262626;
      --color-text: #f5f5f5;
      --color-text-secondary: #a3a3a3;
    }
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--color-backdrop);
    color: var(--color-text);
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .card {
    background: var(--color-panel);
    border-radius: 14px;
    box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
    padding: 32px 36px;
    max-width: 360px;
    text-align: center;
  }
  .spinner {
    width: 28px;
    height: 28px;
    margin: 0 auto 16px;
    border-radius: 50%;
    border: 3px solid color-mix(in srgb, var(--accent) 25%, transparent);
    border-top-color: var(--accent);
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  h1 { font-size: 15px; font-weight: 600; margin: 0 0 6px; }
  p { font-size: 13px; color: var(--color-text-secondary); margin: 0; line-height: 1.5; }
  a { color: var(--accent); }
  .hidden { display: none; }
</style>
</head>
<body>
  <div class="card">
    <div class="spinner" id="spinner"></div>
    <h1 id="heading">Signing you in to Tally&hellip;</h1>
    <p id="message">You can close this tab once Tally opens.</p>
    <p id="fallback" class="hidden" style="margin-top: 14px;">
      If nothing happened, <a id="fallback-link" href="#">click here to continue</a>,
      or return to Tally and try connecting again.
    </p>
  </div>
  <script>
    // Bridges Wrike's OAuth redirect (which must be a public https:// URL)
    // back to Tally's local login listener on the same machine. Wrike
    // doesn't support loopback or custom-scheme redirect URIs, so this
    // static page is the registered redirect_uri in Wrike's App Console;
    // all it does is forward the query string it received to localhost.
    var LOCAL_CALLBACK_PORT = 41820;

    var params = window.location.search; // includes leading "?", e.g. "?code=...&state=..."
    var target = "http://127.0.0.1:" + LOCAL_CALLBACK_PORT + "/callback" + params;

    document.getElementById("fallback-link").href = target;

    if (!params || params.indexOf("code=") === -1 && params.indexOf("error=") === -1) {
      document.getElementById("spinner").classList.add("hidden");
      document.getElementById("heading").textContent = "Nothing to sign in with";
      document.getElementById("message").textContent =
        "This page only works as part of connecting Tally to Wrike. Open Tally and try Connect again.";
    } else {
      window.location.replace(target);
      setTimeout(function () {
        document.getElementById("fallback").classList.remove("hidden");
      }, 1500);
    }
  </script>
</body>
</html>
